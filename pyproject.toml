[project]
name = "wechat-bridge-collector"
version = "3.1.4"
description = "Cross-platform WeChat local message collector and query app for Bridge Agent."
requires-python = ">=3.10"
dependencies = [
  "pycryptodome>=3.19,<4",
  "zstandard>=0.22,<1",
]

[project.scripts]
wechat-bridge-collector = "wechat_bridge_collector.app:main"
wechat-bridge-collector-python = "wechat_bridge_collector.app:main"

[tool.setuptools]
packages = ["wechat_bridge_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
