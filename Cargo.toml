[package]
name = "wechat-bridge-collector"
version = "3.0.1"
edition = "2021"
license = "MIT"
description = "Rust native WeChat local message collector and query service for Bridge Agent."

[[bin]]
name = "wechat-bridge-collector"
path = "src/main.rs"

[dependencies]
aes = "0.8"
cbc = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6.0"
hex = "0.4"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
zstd = "0.13"
